# www/current 指向当前版本（www/releases/<时间>），部署时切换软链接
# 证书：服务器上 acme.sh 申请 Let's Encrypt IP 证书（shortlived，约 6 天），
#   每天自动检查续期，续期后装到 /opt/rolecard/certs 并重载本容器

# 80：只留证书验证，其余跳转到 https
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    # ^~ 让它优先于正则规则
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 不开 HSTS：证书只有 6 天，万一续期失败，浏览器会直接拒绝访问且无法跳过

    server_tokens off;
    absolute_redirect off;
    # 不记访问日志：介绍页承诺了“服务器不记访问记录”
    access_log off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json;

    root /usr/share/nginx/html/current;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location ~ /\. {
        deny all;
    }

    # 带哈希的分包，内容不变，长期缓存
    location /app/assets/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # 自带的 mime.types 里没有 .webmanifest
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
