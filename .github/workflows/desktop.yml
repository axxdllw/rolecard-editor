# 桌面版打包：推送 v 开头的标签（如 v0.1.0）时构建 Windows / macOS 安装包，并生成一个草稿 Release；
# 也可以在 Actions 页面手动运行，只产出构建产物（Artifacts），不发 Release。
name: 桌面版打包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      # 产物统一改成英文文件名：GitHub Release 的附件名不支持中文
      - name: 整理产物
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "out/RoleCardEditor_${version}_windows_x64_setup.exe"
            cp src-tauri/target/release/rolecard-editor.exe "out/RoleCardEditor_${version}_windows_x64_portable.exe"
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/RoleCardEditor_${version}_macos_universal.dmg"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # 草稿状态，确认无误后在 Releases 页面手动发布
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
          body: |
            ## 下载哪个？

            - **Windows 免安装**：`…_windows_x64_portable.exe`，下载后双击即可运行
            - **Windows 安装版**：`…_windows_x64_setup.exe`，不需要管理员权限，会创建开始菜单快捷方式
            - **macOS**（Intel / Apple 芯片通用）：`…_macos_universal.dmg`，打开后把图标拖进“应用程序”

            ## 第一次打开被拦？

            安装包没有购买代码签名证书，系统会提示“来源未知”，这是正常现象：

            - **Windows**：弹出“Windows 已保护你的电脑”时，点 **更多信息 → 仍要运行**
            - **macOS**：提示“已损坏，无法打开”时，打开“终端”执行下面这行，然后再双击打开：
              ```
              xattr -cr /Applications/角色卡编辑器.app
              ```

            数据只保存在本机。换电脑或重装系统前，请先在“设置”里导出备份。
